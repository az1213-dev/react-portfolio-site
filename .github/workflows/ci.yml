name: CI / Deploy Portfolio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which must match the npm that generated
          # package-lock.json. postcss-load-config declares `yaml` as an
          # optional peer dependency, and npm 10 and npm 11 disagree on whether
          # it belongs in the lock file — so a lock written by one is rejected
          # by `npm ci` under the other.
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false

      - name: Build production bundle
        run: npm run build


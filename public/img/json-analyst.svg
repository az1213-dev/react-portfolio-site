<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ja-grad-brace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ja-grad-brace-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bg-grad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />

  <!-- Left Brace -->
  <path d="M 42 32 C 34 32, 35 39, 35 46 C 35 54, 30 56, 26 60 C 30 64, 35 66, 35 74 C 35 81, 34 88, 42 88" stroke="url(#ja-grad-brace)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Right Brace -->
  <path d="M 78 32 C 86 32, 85 39, 85 46 C 85 54, 90 56, 94 60 C 90 64, 85 66, 85 74 C 85 81, 86 88, 78 88" stroke="url(#ja-grad-brace-2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Structure Tree Connectors -->
  <path d="M 52 60 H 58 M 58 45 V 75 M 58 45 H 65 M 58 60 H 65 M 58 75 H 65" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

  <!-- Root Node -->
  <circle cx="47" cy="60" r="5" fill="#2dd4bf" />

  <!-- Child Nodes -->
  <circle cx="69" cy="45" r="4" fill="#38bdf8" />
  <circle cx="69" cy="60" r="4" fill="#818cf8" />
  <circle cx="69" cy="75" r="4" fill="#a5f3fc" opacity="0.9" />
</svg>

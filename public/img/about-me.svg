<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" role="img"
     aria-label="Isometric illustration of a code editor and a dashboard connected to a server stack">
  <defs>
    <linearGradient id="am-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2fafc" />
      <stop offset="100%" stop-color="#dceef3" />
    </linearGradient>
    <linearGradient id="am-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6f4f5" />
    </linearGradient>
    <linearGradient id="am-rack-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a8f8b" />
      <stop offset="100%" stop-color="#0d6d6b" />
    </linearGradient>
    <filter id="am-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f3a4a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#am-bg)" />

  <!-- Ground plate -->
  <polygon points="500,600 940,855 500,1110 60,855" fill="#cfe6ec" opacity="0.55" />
  <polygon points="500,600 940,855 500,1110 60,855" fill="none" stroke="#9fc9d4" stroke-width="2" opacity="0.6" />

  <!-- Network lattice (background) -->
  <g stroke="#8fc0cc" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M 95 265 L 250 190 L 400 250" />
    <path d="M 250 190 L 235 330" />
    <path d="M 905 300 L 800 205 L 660 250" />
    <path d="M 800 205 L 830 350" />
  </g>
  <g fill="#0d7f7c">
    <circle cx="95" cy="265" r="10" />
    <circle cx="250" cy="190" r="13" />
    <circle cx="235" cy="330" r="9" />
    <circle cx="905" cy="300" r="10" />
    <circle cx="800" cy="205" r="13" />
    <circle cx="830" cy="350" r="9" />
  </g>

  <!-- Small isometric cubes -->
  <g>
    <polygon points="70,700 120,729 70,758 20,729" fill="#34a8a4" />
    <polygon points="20,729 70,758 70,800 20,771" fill="#16324a" />
    <polygon points="120,729 70,758 70,800 120,771" fill="#20455f" />

    <polygon points="930,700 980,729 930,758 880,729" fill="#34a8a4" />
    <polygon points="880,729 930,758 930,800 880,771" fill="#16324a" />
    <polygon points="980,729 930,758 930,800 980,771" fill="#20455f" />
  </g>

  <!-- ================= Server / systems stack ================= -->
  <g filter="url(#am-shadow)">
    <polygon points="360,200 500,280 500,440 360,360" fill="#16324a" />
    <polygon points="640,200 500,280 500,440 640,360" fill="#20455f" />
    <polygon points="500,120 640,200 500,280 360,200" fill="url(#am-rack-top)" />
  </g>

  <!-- rack slots, left face -->
  <g transform="matrix(0.866,0.5,0,1,360,200)">
    <g fill="#2fd4c6" opacity="0.85">
      <rect x="18" y="26" width="52" height="9" rx="4" />
      <rect x="18" y="52" width="86" height="9" rx="4" />
      <rect x="18" y="78" width="40" height="9" rx="4" />
      <rect x="18" y="104" width="68" height="9" rx="4" />
    </g>
    <g fill="#e8734a">
      <circle cx="122" cy="30" r="6" />
      <circle cx="122" cy="82" r="6" />
    </g>
  </g>

  <!-- rack slots, right face -->
  <g transform="matrix(-0.866,0.5,0,1,640,200)">
    <g fill="#2fd4c6" opacity="0.6">
      <rect x="18" y="26" width="70" height="9" rx="4" />
      <rect x="18" y="52" width="44" height="9" rx="4" />
      <rect x="18" y="78" width="90" height="9" rx="4" />
      <rect x="18" y="104" width="56" height="9" rx="4" />
    </g>
  </g>

  <!-- label on top face -->
  <g transform="matrix(0.866,-0.5,0.866,0.5,360,200)"
     font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="15" font-weight="700" letter-spacing="1.2" fill="#eafffb">
    <text x="34" y="62">PORTFOLIO</text>
    <text x="34" y="86">IT &amp; DEV</text>
  </g>

  <!-- connectors from stack down to the two panels -->
  <g stroke="#0d7f7c" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 430 380 L 360 420 L 330 470" />
    <path d="M 570 380 L 640 420 L 670 470" />
  </g>
  <g fill="#34a8a4">
    <circle cx="330" cy="470" r="8" />
    <circle cx="670" cy="470" r="8" />
  </g>

  <!-- ================= Panel 1: code editor ================= -->
  <g transform="matrix(0.866,-0.5,0,1,150,560)">
    <!-- stacked cards behind, implying more work than what's on top -->
    <rect x="30" y="-30" width="340" height="260" rx="14" fill="#d3e8ed" stroke="#9fc9d4" stroke-width="3" />
    <rect x="15" y="-15" width="340" height="260" rx="14" fill="#e2f1f4" stroke="#9fc9d4" stroke-width="3" />

    <rect x="0" y="0" width="340" height="260" rx="14" fill="url(#am-panel)"
          stroke="#0d7f7c" stroke-width="3" filter="url(#am-shadow)" />
    <path d="M 0 14 A 14 14 0 0 1 14 0 H 326 A 14 14 0 0 1 340 14 V 44 H 0 Z" fill="#16324a" />
    <g fill="#5f7f90">
      <circle cx="22" cy="22" r="6" />
      <circle cx="42" cy="22" r="6" />
      <circle cx="62" cy="22" r="6" />
    </g>

    <!-- prompt -->
    <path d="M 26 76 l 13 10 l -13 10" fill="none" stroke="#0d7f7c" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" />
    <rect x="50" y="81" width="88" height="10" rx="5" fill="#16324a" opacity="0.55" />

    <!-- code lines -->
    <g rx="5">
      <rect x="26" y="112" width="132" height="10" rx="5" fill="#0d7f7c" />
      <rect x="170" y="112" width="66" height="10" rx="5" fill="#4fb8e0" />

      <rect x="46" y="138" width="86" height="10" rx="5" fill="#16324a" opacity="0.4" />
      <rect x="144" y="138" width="118" height="10" rx="5" fill="#34a8a4" />

      <rect x="46" y="164" width="150" height="10" rx="5" fill="#16324a" opacity="0.4" />

      <rect x="26" y="190" width="104" height="10" rx="5" fill="#34a8a4" />
      <rect x="142" y="190" width="74" height="10" rx="5" fill="#e8734a" opacity="0.85" />

      <rect x="26" y="216" width="58" height="10" rx="5" fill="#0d7f7c" />
    </g>
  </g>

  <!-- ================= Panel 2: dashboard / interface ================= -->
  <g transform="matrix(0.866,0.5,0,1,556,390)">
    <rect x="-30" y="-30" width="340" height="260" rx="14" fill="#d3e8ed" stroke="#9fc9d4" stroke-width="3" />
    <rect x="-15" y="-15" width="340" height="260" rx="14" fill="#e2f1f4" stroke="#9fc9d4" stroke-width="3" />

    <rect x="0" y="0" width="340" height="260" rx="14" fill="url(#am-panel)"
          stroke="#0d7f7c" stroke-width="3" filter="url(#am-shadow)" />
    <path d="M 0 14 A 14 14 0 0 1 14 0 H 326 A 14 14 0 0 1 340 14 V 44 H 0 Z" fill="#16324a" />
    <g fill="#5f7f90">
      <circle cx="22" cy="22" r="6" />
      <circle cx="42" cy="22" r="6" />
      <circle cx="62" cy="22" r="6" />
    </g>

    <!-- section heading -->
    <rect x="26" y="70" width="118" height="12" rx="6" fill="#16324a" opacity="0.55" />

    <!-- stat tiles -->
    <g fill="#f5fcfc" stroke="#0d7f7c" stroke-width="2.5">
      <rect x="26" y="98" width="134" height="60" rx="10" />
      <rect x="174" y="98" width="140" height="60" rx="10" />
    </g>
    <g>
      <rect x="42" y="114" width="48" height="11" rx="5" fill="#0d7f7c" />
      <rect x="42" y="134" width="86" height="8" rx="4" fill="#16324a" opacity="0.35" />
      <rect x="190" y="114" width="62" height="11" rx="5" fill="#4fb8e0" />
      <rect x="190" y="134" width="98" height="8" rx="4" fill="#16324a" opacity="0.35" />
    </g>

    <!-- bar chart -->
    <g>
      <rect x="30" y="206" width="18" height="34" rx="4" fill="#34a8a4" />
      <rect x="58" y="188" width="18" height="52" rx="4" fill="#0d7f7c" />
      <rect x="86" y="214" width="18" height="26" rx="4" fill="#4fb8e0" />
      <rect x="114" y="180" width="18" height="60" rx="4" fill="#0d7f7c" />
      <rect x="142" y="198" width="18" height="42" rx="4" fill="#34a8a4" />
    </g>
    <line x1="26" y1="245" x2="166" y2="245" stroke="#16324a" stroke-width="3"
          stroke-linecap="round" opacity="0.6" />

    <!-- list rows -->
    <g>
      <circle cx="192" cy="186" r="7" fill="#34a8a4" />
      <rect x="208" y="180" width="106" height="12" rx="6" fill="#16324a" opacity="0.35" />
      <circle cx="192" cy="212" r="7" fill="#4fb8e0" />
      <rect x="208" y="206" width="82" height="12" rx="6" fill="#16324a" opacity="0.35" />
      <circle cx="192" cy="238" r="7" fill="#e8734a" />
      <rect x="208" y="232" width="98" height="12" rx="6" fill="#16324a" opacity="0.35" />
    </g>
  </g>
</svg>
